[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
# The packs runner hashes the contents a vector gives, to check the blob, pack and manifest roots.
# Already in the tree through sluice-core.
blake3 = { workspace = true }
# Only here: it measures the shipped size of the .wasm files against the 1.5 MB brotli budget.
brotli = { workspace = true }
clap = { workspace = true }
clap_mangen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The conformance runner calls the same parsers the product uses.
sluice-core = { path = "../crates/sluice-core" }
sluice-live = { path = "../crates/sluice-live" }
# The man pages are made from the same clap definition as the binary.
sluice-cli = { path = "../crates/sluice-cli" }
# A temporary home for the cold-start timing, and for the man page test.
tempfile = { workspace = true }
wasmparser = { workspace = true }

[lints]
workspace = true

# Not released: dist builds only the `sluice` binary of sluice-cli (dist-workspace.toml).
[package.metadata.dist]
dist = false
