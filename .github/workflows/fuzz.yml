name: fuzz

# Every pull request and every push to main runs each fuzz target for 60 seconds, seeded from the
# test vectors, so a parser change that panics on a near-valid input fails before it merges. The
# nightly run gives each target 10 minutes and keeps the corpus it grows in the Actions cache, so
# each night starts where the last one stopped.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # cargo-fuzz needs nightly for the sanitizer flags. Pinned, so that a broken nightly does not fail
  # every pull request on the day it ships. Move it on by hand, with the cargo-fuzz release.
  NIGHTLY: nightly-2026-10-20
  CARGO_FUZZ: 0.13.2

jobs:
  # Builds xtask once and writes the seeds of every target, so the eight fuzz jobs build only the
  # target they run. Every fuzz job needs this one, so the gate here decides for all of them.
  seeds:
    # A scheduled run starts only while the repository is public, where Actions minutes are free,
    # so a private repository spends nothing on it. If the event has no visibility to read, the
    # condition is false and the run is skipped. A manual run always starts.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.repository.visibility == 'public')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Seeds
        shell: bash
        run: |
          for target in ticket manifest manifest_path range hello log relay_config relay_differential; do
            cargo xtask fuzz-seeds "$target" "$RUNNER_TEMP/seeds/$target"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-seeds
          path: ${{ runner.temp }}/seeds
          if-no-files-found: error
          # The fuzz jobs of this run read it, and nothing after them.
          retention-days: 1

  fuzz:
    needs: seeds
    strategy:
      fail-fast: false
      matrix:
        # `dir` is the folder that holds the target's fuzz/ crate.
        include:
          - { dir: crates/sluice-core, target: ticket }
          - { dir: crates/sluice-core, target: hello }
          - { dir: crates/sluice-core, target: manifest }
          - { dir: crates/sluice-core, target: manifest_path }
          - { dir: crates/sluice-core, target: range }
          - { dir: crates/sluice-live, target: log }
          - { dir: docker/guard, target: relay_config }
          - { dir: docker/guard, target: relay_differential }
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIR: ${{ matrix.dir }}
      TARGET: ${{ matrix.target }}
      NIGHTLY_RUN: >-
        ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pinned stable installs cargo-fuzz. Nightly builds the target.
      - run: rustup toolchain install --profile minimal
      - run: rustup toolchain install "$NIGHTLY" --profile minimal
      # install-action has no cargo-fuzz of its own and would fall back to cargo-binstall, so the
      # binary is built once with its lock file and kept in the cache, keyed by its version.
      - id: cargo-fuzz
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ env.CARGO_FUZZ }}-${{ runner.os }}-${{ runner.arch }}
      - if: steps.cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --version "$CARGO_FUZZ" --locked
      # The target's own workspace, built by nightly. rust-cache reads the version of the stable
      # toolchain, so the nightly goes in the key by hand. The bin folder is cached above.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}-${{ env.NIGHTLY }}
          workspaces: ${{ matrix.dir }}/fuzz -> target
          cache-bin: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fuzz-seeds
          path: ${{ runner.temp }}/seeds
      # Only the nightly run keeps a corpus. The smoke run starts from the vectors alone, so its
      # result depends on the pull request and nothing else. The corpus is where cargo-fuzz keeps
      # one by default, beside the target: `cargo fuzz cmin` renames its result into place from a
      # folder there, and a rename fails across file systems (os error 18, seen in WSL).
      - if: env.NIGHTLY_RUN == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.dir }}/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        shell: bash
        run: |
          seconds=60
          if [ "$NIGHTLY_RUN" = true ]; then seconds=600; fi
          cd "$DIR"
          corpus="fuzz/corpus/$TARGET"
          mkdir -p "$corpus"
          cp "$RUNNER_TEMP/seeds/$TARGET"/* "$corpus"/
          # A pipe and not a process substitution, so bash waits for tee to write the whole log,
          # and pipefail keeps the fuzzer's exit status.
          cargo "+$NIGHTLY" fuzz run "$TARGET" "$corpus" -- \
            -max_total_time="$seconds" -print_final_stats=1 \
            2>&1 | tee "$RUNNER_TEMP/fuzz-$TARGET.log"
      # A night that crashed still grew the corpus, so it is minimized and saved either way. The
      # input that crashed is in the artifacts folder, not in the corpus.
      - if: always() && env.NIGHTLY_RUN == 'true'
        name: Minimize the corpus
        shell: bash
        run: |
          cd "$DIR"
          cargo "+$NIGHTLY" fuzz cmin "$TARGET" "fuzz/corpus/$TARGET"
      # A cache key is written once and never replaced. With the run id alone, a re-run of a night
      # had the key the first attempt already saved under, and its corpus was thrown away.
      - if: always() && env.NIGHTLY_RUN == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.dir }}/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
      # libFuzzer writes the input that crashed into the target's artifacts folder.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-${{ matrix.target }}
          path: |
            ${{ matrix.dir }}/fuzz/artifacts/${{ matrix.target }}
            ${{ runner.temp }}/fuzz-${{ matrix.target }}.log
          if-no-files-found: ignore
