# Generated by dist 0.33.1 (https://axodotdev.github.io/cargo-dist) and then changed by hand, which
# is why dist-workspace.toml sets `allow-dirty = ["ci"]`. RELEASING.md says how to regenerate it and
# what to put back. The changes from dist's output:
#
# * every action is pinned to a commit SHA, with its version in a comment;
# * dist, cargo-auditable and cargo-cyclonedx are installed at exact versions and checked, not
#   piped from an installer script or taken from "latest";
# * a tag first runs the whole of ci.yml, and nothing builds until it passes;
# * the plan job refuses a tag with anything but letters, digits, `.` and `-` after the `v`;
# * every step runs in bash, on Windows too, and no `${{ }}` is pasted into a script: each value
#   a script needs comes in through `env:` and is quoted there;
# * the workflow reads only, and the two publishing jobs are the only ones that ask for more than
#   `contents: read` in the `release` environment. That is what this file asks for, and not what a
#   tag is held to: the `release.yml` of the tagged commit is the one that runs (RELEASING.md);
# * only sluice-cli's SBOM is released, for all targets, and it is uploaded: dist's template read
#   `steps.cargo-cyclonedx.output.paths`, which is always empty, so the SBOM was left behind;
# * the `rendezvous` and `relay` images are built here, the GitHub release waits for both, and they
#   are pushed only after it is made: a failed build publishes nothing, and an image push that
#   fails after the GitHub release leaves the release without images (RELEASING.md);
# * the GitHub release is made as a draft with every file, then published, because an immutable
#   release cannot take a file after it is published (RELEASING.md);
# * every artifact `host` reads is kept 30 days and the images 35, so each outlives the run that
#   would read it;
# * the steps dist writes for system packages, containers and announcements are gone, because
#   no target uses them.
#
# A tag `v<version>` starts a release. The maintainer pushes it by hand after merging the release
# pull request, and the publishing jobs then wait for a reviewer of the `release` environment. A
# pull request runs `dist plan` only, which checks dist-workspace.toml and builds nothing.

name: release

on:
  pull_request:
  push:
    # A filter cannot say "letters, digits, dots and dashes", so the plan job checks the rest.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

# The group is the ref, so a second run for the same tag waits for the first instead of cancelling
# it halfway through an upload. Two different tags, such as v0.2.0 and v0.2.1, run side by side.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Without this a step with no `shell:` runs in PowerShell on the Windows runners, which reads a `\`
# at the end of a line as text, and both Windows builds fail.
defaults:
  run:
    shell: bash

env:
  DIST_VERSION: 0.33.1

jobs:
  # The checks of every push to main, run again on the tagged commit. A release pull request is
  # opened with GITHUB_TOKEN, and GitHub runs no workflows for it, so this is where its checks run.
  # A job that calls a workflow cannot set `timeout-minutes`, so each job of ci.yml sets its own.
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Checks the tag, then runs `dist plan` on a pull request or computes the release on a tag.
  # Downloads dist and plans offline: 15 minutes is ten times what it needs.
  plan:
    needs: ci
    if: >-
      !cancelled() &&
      (needs.ci.result == 'success' ||
       (github.event_name == 'pull_request' && needs.ci.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ steps.tag.outputs.tag }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Every later job reads the tag from this output. Git allows `$(...)`, `;` and `+` in a tag
      # name, and `docker tag` refuses a `+`.
      - id: tag
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::the tag must be v<major>.<minor>.<patch>, optionally followed by -" \
              "and letters, digits, dots or dashes"
            exit 1
          fi
          echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        run: bash .github/release/install-dist.sh
      - name: Cache dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-dist-cache
          path: ${{ runner.temp }}/dist-install/bin/dist
          # `host` reads it after the approval, which an environment waits up to 30 days for.
          retention-days: 30
      # A tag computes the release it will host, offline. A pull request only plans.
      - id: plan
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            dist host --steps=create "--tag=$TAG" --output-format=json > plan-dist-manifest.json
          else
            dist plan --output-format=json > plan-dist-manifest.json
          fi
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json
          retention-days: 30

  # Builds and packages the binary of each target, on its own native runner. A release build with
  # thin LTO took 7 minutes on 2 cores in WSL, and cargo-auditable compiles first. The ARM and
  # Intel macOS runners are slower, so 90 minutes leaves room without letting a hung build hold
  # the release for the default 6 hours.
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    needs:
      - plan
    if: >-
      fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null &&
      (needs.plan.outputs.publishing == 'true' ||
       fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload')
    strategy:
      fail-fast: false
      # One native runner per target, from dist-workspace.toml.
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      # The toolchain of rust-toolchain.toml, so a release builds with what CI tested.
      - name: Install Rust
        run: rustup toolchain install --profile minimal
      - name: Install dist
        run: bash .github/release/install-dist.sh
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      # Built from crates.io with its lock file, where dist's template pipes the latest release's
      # installer into a shell.
      - name: Install cargo-auditable
        run: cargo install cargo-auditable --version 0.7.7 --locked
      - name: Build artifacts
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          DIST_ARGS: ${{ matrix.dist_args }}
        run: |
          # DIST_ARGS is two flags from dist-workspace.toml, and is split on purpose.
          # shellcheck disable=SC2086
          dist build "--tag=$TAG" --print=linkage --output-format=json $DIST_ARGS \
            > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        run: |
          # Parse out what we just built and upload it to scratch storage
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
          retention-days: 30

  # The installers, checksums, source archive and SBOM. Compiling cargo-cyclonedx is most of it, and
  # takes a few minutes, so 45 is several times that.
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust
        run: rustup toolchain install --profile minimal
      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Built from crates.io with its lock file, at the latest release, where dist's template
      # pipes the installer of 0.5.5 into a shell.
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          dist build "--tag=$TAG" --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          {
            echo "paths<<EOF"
            jq --raw-output ".upload_files[]" dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      # cargo-cyclonedx writes one SBOM per workspace member, with or without --manifest-path, and
      # only the released package's goes up. `--target all` lists the dependencies of every target,
      # windows-sys included, since one file describes all six builds.
      - id: cargo-cyclonedx
        run: |
          cargo cyclonedx -v --target all
          mv crates/sluice-cli/sluice-cli.cdx.xml target/distrib/
          echo "paths=target/distrib/sluice-cli.cdx.xml" >> "$GITHUB_OUTPUT"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ steps.cargo-cyclonedx.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
          retention-days: 30

  # Both images of ADR 0013 on native amd64 and arm64 runners, beside the binary builds. Builds and
  # saves, and pushes nothing: this job asks for no registry permission. The two `image-publish`
  # jobs are the only ones in this file that hold `packages: write`, and the `release` environment
  # reviews them. What a tag's own `release.yml` asks for is that commit's to say (RELEASING.md).
  # Compiling iroh-relay in the build stage is most of it, and 60 minutes leaves room on the arm64
  # runners, the slower half.
  image-build:
    needs: plan
    if: needs.plan.outputs.publishing == 'true'
    strategy:
      fail-fast: false
      matrix:
        image: [rendezvous, relay]
        platform:
          # Pinned, so a new `ubuntu-latest` cannot change the Docker that builds a release.
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    env:
      IMAGE: ${{ matrix.image }}
      ARCH: ${{ matrix.platform.arch }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The source label links the package on ghcr.io to this repository, which is what lets
      # GITHUB_TOKEN push to it again next time. Without --provenance=false and --sbom=false, a
      # builder that stores images in containerd adds an attestation manifest, the push is then an
      # index and not one image, and push-image.sh refuses it. The SBOM comes from syft below.
      - name: Build
        run: |
          mkdir -p "$RUNNER_TEMP/image"
          docker build --provenance=false --sbom=false --tag "sluice-$IMAGE:$ARCH" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=${TAG#v}" \
            --file "docker/$IMAGE/Dockerfile" docker
      # The distroless image has no shell, so the binary is run directly.
      - name: Smoke test
        run: docker run --rm --entrypoint /usr/local/bin/iroh-relay "sluice-$IMAGE:$ARCH" --version
      # The image starts with a read-only root, and its guard refuses each config that would open
      # more than it says (ADR 0019, ADR 0020).
      - name: Guard smoke test
        run: bash docker/smoke-test.sh "$IMAGE" "sluice-$IMAGE:$ARCH"
      # From this architecture's own image, on its own runner, so each SBOM lists what that image
      # holds. The publishing job attests it on the digest the registry gives the image.
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: sluice-${{ matrix.image }}:${{ matrix.platform.arch }}
          format: spdx-json
          output-file: ${{ runner.temp }}/image/${{ matrix.platform.arch }}.spdx.json
          syft-version: v1.55.0
          upload-artifact: false
          upload-release-assets: false
      - name: Save
        run: docker save "sluice-$IMAGE:$ARCH" | gzip > "$RUNNER_TEMP/image/$ARCH.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.image }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/image/
          if-no-files-found: error
          # GitHub cancels a run 35 days after it starts, waiting for an approval included, and a
          # re-run is allowed only within 30 days of that start. So these outlive every run that
          # could read them, and no longer.
          retention-days: 35

  # Publishes the GitHub release. It waits in the `release` environment for a reviewer before it
  # starts (RELEASING.md). Uploads a few MB and signs one attestation: 30 minutes is plenty.
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
      - image-build
    # Only when publishing, and only if plan, local and global did not fail (skipped is fine) and
    # every image built. A failed image build so stops the release before anything is public.
    # `!cancelled()` and not `always()`, so a cancelled run publishes nothing.
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' &&
      (needs.build-global-artifacts.result == 'skipped' ||
       needs.build-global-artifacts.result == 'success') &&
      (needs.build-local-artifacts.result == 'skipped' ||
       needs.build-local-artifacts.result == 'success') &&
      needs.image-build.result == 'success'
    environment: release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # The GitHub release and its files.
      contents: write
      # The OIDC token and the attestation store, for actions/attest.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          dist host "--tag=$TAG" --steps=upload --steps=release --output-format=json \
            > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      # Provenance for every file of the release: archives, installers, checksums and the SBOM.
      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/*
      # An immutable release takes no file after it is published, so the release is made as a
      # draft with every file and published last. GitHub's advice is the same: "create releases as
      # drafts first, attach all assets, and then publish" (RELEASING.md).
      - name: Create the draft release and add every file
        env:
          PRERELEASE_FLAG: >-
            ${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease &&
                '--prerelease' || '' }}
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          # Write and read notes from a file to avoid quoting breaking things. printf, because echo
          # reads a body that starts with -n or -e as a flag.
          printf '%s\n' "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"

          # PRERELEASE_FLAG is empty or one word, and must vanish when empty.
          # shellcheck disable=SC2086
          gh release create "$TAG" --draft --target "$RELEASE_COMMIT" $PRERELEASE_FLAG \
            --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*
      # The one step that makes anything public. Every file is attached, and its attestation is in
      # the store, before this runs.
      - name: Publish the release
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: gh release edit "$TAG" --draft=false

  # Pushes, merges and attests one image, only after the GitHub release exists. It runs in the
  # `release` environment, which may ask for a second approval (RELEASING.md). `push-image.sh arch`
  # writes both architecture tags, each is attested with its SBOM, and only then does
  # `push-image.sh index` create the version tag, which is attested last. Moves two images of at
  # most 62 MB each and signs five attestations: 30 minutes is plenty.
  image-publish:
    needs:
      - plan
      - host
      - image-build
    # Named in full, and not left to the implicit `success()`, so the condition says what it needs:
    # the GitHub release exists and both architectures of every image built. `!cancelled()` so a
    # cancelled run pushes nothing.
    if: >-
      !cancelled() && needs.host.result == 'success' && needs.image-build.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        image: [rendezvous, relay]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    # A job's permissions replace the workflow's, so `contents: read` is named again for checkout.
    permissions:
      contents: read
      # The image and its attestations, on ghcr.io.
      packages: write
      # The OIDC token and the attestation store, for actions/attest.
      id-token: write
      attestations: write
    env:
      IMAGE: ${{ matrix.image }}
      OWNER: ${{ github.repository_owner }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-${{ matrix.image }}-*
          path: ${{ runner.temp }}/image
          merge-multiple: true
      # Each architecture goes up under its own tag, after its platform is checked, and nothing is
      # attested or pushed after it until the attestation of each one below has succeeded.
      - name: Push each architecture
        id: push-arch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # On the step itself, so no job or workflow value can change it. A value an earlier step
          # writes to GITHUB_ENV is not covered by GitHub's documented precedence, and push-image.sh
          # refuses any other registry on a tag.
          REGISTRY: ghcr.io
        run: bash .github/release/push-image.sh arch
      # Provenance for each architecture's image, which is what a pull on that architecture fetches.
      - name: Attest amd64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push-arch.outputs.name }}
          subject-digest: ${{ steps.push-arch.outputs.amd64 }}
          push-to-registry: true
      - name: Attest arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push-arch.outputs.name }}
          subject-digest: ${{ steps.push-arch.outputs.arm64 }}
          push-to-registry: true
      - name: Attest the amd64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push-arch.outputs.name }}
          subject-digest: ${{ steps.push-arch.outputs.amd64 }}
          sbom-path: ${{ runner.temp }}/image/amd64.spdx.json
          push-to-registry: true
      - name: Attest the arm64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push-arch.outputs.name }}
          subject-digest: ${{ steps.push-arch.outputs.arm64 }}
          sbom-path: ${{ runner.temp }}/image/arm64.spdx.json
          push-to-registry: true
      # The version tag, which `docker pull <image>:<version>` resolves. It is created only after
      # both architectures are attested, so no public tag is left without one.
      - name: Create the version index
        id: push-index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ghcr.io
        run: bash .github/release/push-image.sh index
      - name: Attest the index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push-index.outputs.name }}
          subject-digest: ${{ steps.push-index.outputs.index }}
          push-to-registry: true
      # A step and not a job condition: it removes the registry login, so it runs on a cancel too.
      - if: always()
        env:
          REGISTRY: ghcr.io
        run: docker logout "$REGISTRY"
