# Generated by dist 0.33.1 (https://axodotdev.github.io/cargo-dist) and then pinned by hand, which
# is why dist-workspace.toml sets `allow-dirty = ["ci"]`. RELEASING.md says how to regenerate it and
# what to put back. The changes from dist's output:
#
# * every action is pinned to a commit SHA, with its version in a comment;
# * dist, cargo-auditable and cargo-cyclonedx are installed at exact versions and checked, not
#   piped from an installer script or taken from "latest";
# * a tag first runs the whole of ci.yml, and nothing builds until it passes;
# * the workflow reads only, and the publishing job alone writes, in the `release` environment;
# * only sluice-cli's SBOM is released, for all targets, and it is uploaded: dist's template read
#   `steps.cargo-cyclonedx.output.paths`, which is always empty, so the SBOM was left behind.
#
# A tag `v<version>` starts a release. It is the approval point: the maintainer pushes it by hand
# after merging the release pull request, and the publishing job then waits for a reviewer of the
# `release` environment. A pull request runs `dist plan` only, which checks dist-workspace.toml and
# builds nothing.

name: release

on:
  pull_request:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

env:
  DIST_VERSION: 0.33.1

jobs:
  # The checks of every push to main, run again on the tagged commit. A release pull request is
  # opened with GITHUB_TOKEN, and GitHub runs no workflows for it, so this is where its checks run.
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    needs: ci
    if: >-
      !cancelled() &&
      (needs.ci.result == 'success' ||
       (github.event_name == 'pull_request' && needs.ci.result == 'skipped'))
    runs-on: ubuntu-24.04
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        shell: bash
        run: bash .github/release/install-dist.sh
      - name: Cache dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-dist-cache
          path: ${{ runner.temp }}/dist-install/bin/dist
      # A tag computes the release it will host, offline. A pull request only plans.
      - id: plan
        env:
          DIST_COMMAND: >-
            ${{ (!github.event.pull_request &&
                 format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }}
        run: |
          # Split on purpose: the command is two to three words.
          # shellcheck disable=SC2086
          dist $DIST_COMMAND --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: >-
      fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null &&
      (needs.plan.outputs.publishing == 'true' ||
       fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload')
    strategy:
      fail-fast: false
      # One native runner per target, from dist-workspace.toml.
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      # The toolchain of rust-toolchain.toml, so a release builds with what CI tested.
      - name: Install Rust
        shell: bash
        run: rustup toolchain install --profile minimal
      - name: Install dist
        shell: bash
        run: bash .github/release/install-dist.sh
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      # Built from crates.io with its lock file, where dist's template pipes the latest release's
      # installer into a shell.
      - name: Install cargo-auditable
        shell: bash
        run: cargo install cargo-auditable --version 0.7.7 --locked
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json \
            ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust
        run: rustup toolchain install --profile minimal
      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Built from crates.io with its lock file, at the latest release, where dist's template
      # pipes the installer of 0.5.5 into a shell.
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" \
            > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          {
            echo "paths<<EOF"
            jq --raw-output ".upload_files[]" dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      # cargo-cyclonedx writes one SBOM per workspace member, with or without --manifest-path, and
      # only the released package's goes up. `--target all` lists the dependencies of every target,
      # windows-sys included, since one file describes all six builds.
      - id: cargo-cyclonedx
        shell: bash
        run: |
          cargo cyclonedx -v --target all
          mv crates/sluice-cli/sluice-cli.cdx.xml target/distrib/
          echo "paths=target/distrib/sluice-cli.cdx.xml" >> "$GITHUB_OUTPUT"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ steps.cargo-cyclonedx.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Publishes the release. The one job that writes, and it waits in the `release` environment for
  # a reviewer before it starts (RELEASING.md).
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only when publishing, and only if plan, local and global did not fail (skipped is fine).
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' &&
      (needs.build-global-artifacts.result == 'skipped' ||
       needs.build-global-artifacts.result == 'success') &&
      (needs.build-local-artifacts.result == 'skipped' ||
       needs.build-local-artifacts.result == 'success')
    environment: release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-24.04
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    permissions:
      # The GitHub release and its files.
      contents: write
      # The OIDC token and the attestation store, for actions/attest.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release \
            --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      # Provenance for every file of the release: archives, installers, checksums and the SBOM.
      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/*
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: >-
            ${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease &&
                '--prerelease' || '' }}
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"

          # PRERELEASE_FLAG is empty or one word, and must vanish when empty.
          # shellcheck disable=SC2086
          gh release create "$TAG" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG \
            --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  announce:
    needs:
      - plan
      - host
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
