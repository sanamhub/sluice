name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs every check here on a tag before it builds anything.
  workflow_call:
  # The release pull request is opened with GITHUB_TOKEN, which starts no workflows, so the
  # maintainer runs this on its branch by hand (RELEASING.md).
  workflow_dispatch:

permissions:
  contents: read

# A push to main never cancels the run before it, so every commit on main keeps a full result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job stops well before GitHub's default of 6 hours, so a hung test cannot hold release.yml,
# which runs these jobs, and a second run for the same tag queues behind it. Each limit allows for
# a build with no cache on the slowest runner of its matrix.
jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain and components pinned in rust-toolchain.toml. rustup is
      # deprecating the implicit install on first use.
      - run: rustup toolchain install --profile minimal
      - run: cargo fmt --all --check

  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # The Windows runners can create symbolic links, so a test that needs one must not pass by
      # skipping. An empty value on the other runners is not set: `var` is empty there, and the
      # tests read it as absent.
      SLUICE_REQUIRE_SYMLINKS: ${{ matrix.os == 'windows-latest' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest
      # A test refuses a home another user owns, and only root can make one. The Linux and macOS
      # runner images "both run using passwordless sudo" (GitHub's runner reference), so this needs
      # no secret and no password.
      - name: Make a folder owned by root
        if: runner.os != 'Windows'
        run: |
          dir="$(mktemp -d)"
          sudo chown root:root "$dir"
          sudo chmod 755 "$dir"
          echo "SLUICE_ROOT_OWNED_DIR=$dir" >> "$GITHUB_ENV"
      # nextest does not run doctests.
      - run: cargo nextest run
      - run: cargo test --doc --workspace

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep in step with rust-version in the root Cargo.toml.
      - run: rustup toolchain install 1.90 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # iroh 1.4.0 and iroh-blobs 0.103.1 need Rust 1.91, and the probe is not a product crate.
      - run: cargo +1.90 check --all-targets --workspace --exclude sluice-probe

  # The browser build of the live log (ADR 0014). Nothing else builds sluice-live for wasm32, so
  # without this job a change that breaks the browser would pass every other check.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check -p sluice-live --target wasm32-unknown-unknown

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny
      - run: cargo deny check

  # The images' entry point (ADR 0019, ADR 0020) is a project of its own, outside the workspace, so
  # the jobs above never build it. It gets the same gates here. cargo-deny reads deny.toml from the
  # folder it runs in, which is the root, so the guard is held to the same advisories and licenses.
  relay-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GUARD: docker/guard/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: docker/guard -> target
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny
      - run: cargo fmt --manifest-path "$GUARD" --check
      - run: cargo clippy --manifest-path "$GUARD" --locked --all-targets -- -D warnings
      # Runs the doctests too, which nextest would not.
      - run: cargo test --manifest-path "$GUARD" --locked
      - run: cargo deny --manifest-path "$GUARD" check

  # The workflows and the shell scripts they run. A mistake in release.yml or push-image.sh shows
  # only on a tag otherwise, which is the worst time to find it. Both tools come from their
  # releases at exact versions, checked against hashes in the script.
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash .github/ci/install-lint-tools.sh
      # actionlint also runs shellcheck on every `run:` block; this names the one installed above.
      - run: actionlint -shellcheck "$(command -v shellcheck)"
      - run: |
          find .github -name '*.sh' -print0 | xargs -0 shellcheck
          find docker -name smoke-test.sh -print0 | xargs -0 shellcheck

  # docs/performance.md sets 30 ms from a cold start to a printed result. The command builds sluice
  # in release and fails if the median of `sluice id` or `sluice --version` is over it. Linux and
  # Windows are the two systems it is measured on.
  cold-start:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo xtask cold-start
