name: site

# The landing page lives in site/ (ADR 0022). Cloudflare Workers Builds deploys it from the same
# repository and holds the Cloudflare side; this workflow is the gate a pull request passes first:
# the committed lock file installs, the types check, and the static build succeeds. It runs only
# when the site or this file changes.
on:
  pull_request:
    paths:
      - site/**
      - .github/workflows/site.yml
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/site.yml

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
