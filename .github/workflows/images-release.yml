name: images-release

# A tag v<version> builds both images of ADR 0013 on native amd64 and arm64 runners, then pushes
# each to ghcr.io as one multi-arch image tagged with the version, with its build provenance and an
# SBOM attested in the registry. The pushing job runs in the `release` environment, so a reviewer
# approves it, as for release.yml (RELEASING.md).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  # Builds and saves, and pushes nothing: only the publishing job may write to the registry.
  build:
    strategy:
      fail-fast: false
      matrix:
        image: [rendezvous, relay]
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    env:
      IMAGE: ${{ matrix.image }}
      ARCH: ${{ matrix.platform.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # On its own architecture, so nothing is emulated. The source label links the package on
      # ghcr.io to this repository, which is what lets GITHUB_TOKEN push to it again next time.
      - name: Build
        run: |
          docker build --tag "sluice-$IMAGE:$ARCH" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME#v}" \
            "docker/$IMAGE"
      # The distroless image has no shell, so the binary is run directly.
      - run: docker run --rm --entrypoint /usr/local/bin/iroh-relay "sluice-$IMAGE:$ARCH" --version
      - run: docker save "sluice-$IMAGE:$ARCH" | gzip > "$RUNNER_TEMP/$IMAGE-$ARCH.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.image }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/${{ matrix.image }}-${{ matrix.platform.arch }}.tar.gz
          if-no-files-found: error
          # The publishing job of this run reads it, and nothing after it.
          retention-days: 1

  # Pushes, merges and attests. The one job that writes, and it waits in the `release` environment
  # for a reviewer before it starts.
  publish:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: [rendezvous, relay]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      # The image and its attestations, on ghcr.io.
      packages: write
      # The OIDC token and the attestation store, for the attest actions.
      id-token: write
      attestations: write
    env:
      IMAGE: ${{ matrix.image }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-${{ matrix.image }}-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      # Each architecture goes up under its own tag, and the version tag is the index of both.
      - name: Push
        id: push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A ghcr.io name is lower case, and an owner's login may not be.
          repo="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/sluice-$IMAGE"
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for arch in amd64 arm64; do
            docker load --input "$RUNNER_TEMP/images/$IMAGE-$arch.tar.gz"
            docker tag "sluice-$IMAGE:$arch" "$repo:$version-$arch"
            docker push "$repo:$version-$arch"
          done
          docker buildx imagetools create --tag "$repo:$version" \
            "$repo:$version-amd64" "$repo:$version-arm64"
          index="$(docker buildx imagetools inspect "$repo:$version" --format '{{json .Manifest}}')"
          digest="$(echo "$index" | jq --raw-output .digest)"
          {
            echo "name=$repo"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # Syft reads the pushed index and describes the amd64 image. The arm64 one is built from
      # the same Dockerfile, base images and crate versions.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.push.outputs.name }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          syft-version: v1.55.0
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true
      - if: always()
        run: docker logout ghcr.io
