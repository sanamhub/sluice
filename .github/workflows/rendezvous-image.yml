name: rendezvous-image

# Only the Dockerfile, the configs and this file can break the build, so only a change to them runs it.
# A separate workflow because `paths` filters a whole workflow and not a job, and ci.yml has to run
# on every change.
on:
  push:
    branches: [main]
    paths:
      - docker/**
      - .github/workflows/rendezvous-image.yml
  pull_request:
    paths:
      - docker/**
      - .github/workflows/rendezvous-image.yml

permissions:
  contents: read

concurrency:
  group: rendezvous-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Nothing is pushed or loaded anywhere else. The build compiles iroh-relay from crates.io, which
      # is the step a yanked release or a moved base image breaks.
      - run: docker build --tag sluice-rendezvous:ci docker/rendezvous
      # The distroless image has no shell, so the binary is run directly.
      - run: docker run --rm --entrypoint /usr/local/bin/iroh-relay sluice-rendezvous:ci --version
