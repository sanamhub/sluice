name: images

# Only the Dockerfiles, their configs, the guard's sources (all under docker/) and the release
# scripts and workflow that build and push the images can break an image build, so only a change to
# them runs it. A workflow of its own because `paths` filters a whole workflow and not a job, and
# ci.yml has to run on every change.
on:
  push:
    branches: [main]
    paths:
      - docker/**
      - .github/release/**
      - .github/workflows/images.yml
      - .github/workflows/release.yml
  pull_request:
    paths:
      - docker/**
      - .github/release/**
      - .github/workflows/images.yml
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One row per image of ADR 0013. They share the build, so a change to one can break the other.
  build:
    strategy:
      fail-fast: false
      matrix:
        image: [rendezvous, relay]
    runs-on: ubuntu-latest
    # Compiling iroh-relay is most of it. As in release.yml's image-build, 60 minutes leaves room
    # without letting a hung build run for GitHub's default of 6 hours.
    timeout-minutes: 60
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Nothing is pushed or loaded anywhere else. The build compiles iroh-relay from crates.io,
      # which is the step a yanked release or a moved base image breaks. The flags are those
      # of release.yml.
      - run: |
          docker build --provenance=false --sbom=false --tag "sluice-$IMAGE:ci" "docker/$IMAGE"
      # The distroless image has no shell, so the binary is run directly.
      - run: docker run --rm --entrypoint /usr/local/bin/iroh-relay "sluice-$IMAGE:ci" --version
      # The relay starts, and its guard refuses each config that would open it by mistake, so a
      # guard that lets a typo through fails here (ADR 0019).
      - if: matrix.image == 'relay'
        run: bash docker/relay/smoke-test.sh "sluice-$IMAGE:ci"
