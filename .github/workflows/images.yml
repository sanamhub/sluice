name: images

# Only the Dockerfiles, their configs, the guard's sources (all under docker/) and the release
# scripts and workflow that build and push the images can break an image build, so only a change to
# them runs it. A workflow of its own because `paths` filters a whole workflow and not a job, and
# ci.yml has to run on every change.
on:
  push:
    branches: [main]
    paths:
      - docker/**
      - .github/release/**
      - .github/workflows/images.yml
      - .github/workflows/release.yml
  pull_request:
    paths:
      - docker/**
      - .github/release/**
      - .github/workflows/images.yml
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One row per image of ADR 0013. They share the build, so a change to one can break the other.
  build:
    strategy:
      fail-fast: false
      matrix:
        image: [rendezvous, relay]
    runs-on: ubuntu-latest
    # Compiling iroh-relay is most of it. As in release.yml's image builds, 60 minutes leaves room
    # without letting a hung build run for GitHub's default of 6 hours.
    timeout-minutes: 60
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Nothing is pushed or loaded anywhere else. The build compiles iroh-relay from crates.io,
      # which is the step a yanked release or a moved base image breaks. The flags are those
      # of release.yml.
      # The context is docker/, for the guard, and Dockerfile.dockerignore beside each Dockerfile
      # keeps it to the files that image needs.
      - run: |
          docker build --provenance=false --sbom=false --tag "sluice-$IMAGE:ci" \
            --file "docker/$IMAGE/Dockerfile" docker
      # The distroless image has no shell, so the binary is run directly.
      - run: docker run --rm --entrypoint /usr/local/bin/iroh-relay "sluice-$IMAGE:ci" --version
      # Each image starts with a read-only root, and its guard refuses each config that would open
      # more than it says, so a guard that lets a mistake through fails here (ADR 0019, ADR 0020).
      - run: bash docker/smoke-test.sh "$IMAGE" "sluice-$IMAGE:ci"
      # The shape of a release's image artifacts: one per architecture, each holding that
      # architecture's tarball. The push test below downloads them the way image-publish does,
      # then replaces them with stand-ins.
      - name: Save for the push test
        run: |
          mkdir -p "$RUNNER_TEMP/image"
          for arch in amd64 arm64; do
            docker tag "sluice-$IMAGE:ci" "sluice-$IMAGE:$arch"
            # Written to a file and compressed in two steps: a pipe hides a failed `docker save`
            # behind gzip's exit status, and the empty archive it leaves fails later as a load.
            docker save --output "$RUNNER_TEMP/image/$arch.tar" "sluice-$IMAGE:$arch"
            gzip --force "$RUNNER_TEMP/image/$arch.tar"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.image }}-amd64
          path: ${{ runner.temp }}/image/amd64.tar.gz
          if-no-files-found: error
          # Only the push job below reads it, minutes later.
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.image }}-arm64
          path: ${{ runner.temp }}/image/arm64.tar.gz
          if-no-files-found: error
          retention-days: 1

  # Runs .github/release/push-image.sh, the script a release uses, against a registry on this
  # runner, so a change to the script, the workflow or an image is tested before a tag and not on
  # it. It cannot test ghcr.io: the login, the permissions and the attestations need a tag run.
  #
  # It downloads the two artifacts per image the way image-publish does, then pushes stand-ins in
  # their place: the architecture check needs a real linux/arm64 image, and building iroh-relay
  # under emulation on a pull request is too slow. A stand-in is `FROM scratch`, so buildx builds
  # one per platform with nothing to run and no emulation.
  push:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: [rendezvous, relay]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # The distribution registry, by digest of its 3.1.2 index. Plain HTTP on localhost, which
      # Docker treats as insecure by default. It holds nothing after the job.
      registry:
        image: "registry:3.1.2@sha256:\
          01cd312e67026f06f5d89c3e133a4a9adc7cb9eeb9b1194e0b2954dfd770efd2"
        ports:
          - 5000:5000
    env:
      IMAGE: ${{ matrix.image }}
      OWNER: sanamhub
      TAG: v0.0.0-test
      # The local registry asks for no login. The script requires a token and a user, so these are
      # literals and not a secret.
      GITHUB_TOKEN: not-a-secret
      GITHUB_ACTOR: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Two artifacts, merged into one folder, as release.yml's image-publish downloads them.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-${{ matrix.image }}-*
          path: ${{ runner.temp }}/image
          merge-multiple: true
      - name: Check the download
        run: |
          for arch in amd64 arm64; do
            test -s "$RUNNER_TEMP/image/$arch.tar.gz"
          done
      # The two platforms the architecture check reads, built here and not from the image, so the
      # test needs no arm64 host. Their IDs are what the release's build job records.
      - id: standins
        name: Build the stand-ins
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --tag "sluice-$IMAGE:$arch" --load \
              --file docker/push-test/Dockerfile docker/push-test
            docker save --output "$RUNNER_TEMP/image/$arch.tar" "sluice-$IMAGE:$arch"
            gzip --force "$RUNNER_TEMP/image/$arch.tar"
            id="$(docker image inspect "sluice-$IMAGE:$arch" --format '{{.Id}}')"
            echo "$arch=$id" >> "$GITHUB_OUTPUT"
          done
      # The image's ID is an output of the build job, recorded before syft ran, so `arch` compares
      # the loaded image with it and refuses a tarball that holds another one. A well-formed ID
      # that no image has is enough: the check must fail before anything is tagged or pushed.
      - name: An image whose ID is not the expected one is refused
        env:
          GITHUB_OUTPUT: ${{ runner.temp }}/refusal-output
          AMD64_ID: ${{ steps.standins.outputs.amd64 }}
          ARM64_ID: ${{ steps.standins.outputs.arm64 }}
        run: |
          : > "$GITHUB_OUTPUT"
          wrong="sha256:$(printf '0%.0s' {1..64})"
          set +e
          message="$(bash .github/release/push-image.sh localhost:5000 arch \
            "$wrong" "$ARM64_ID" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$message"
          test "$code" = 1
          grep -q 'is not the image its SBOM describes' <<< "$message"
          if docker buildx imagetools inspect \
            "localhost:5000/sanamhub/sluice-$IMAGE:0.0.0-test-amd64" > /dev/null 2>&1; then
            echo "::error::push-image.sh pushed a tag before it checked the image's ID"
            exit 1
          fi
      - id: push-arch
        env:
          AMD64_ID: ${{ steps.standins.outputs.amd64 }}
          ARM64_ID: ${{ steps.standins.outputs.arm64 }}
        run: bash .github/release/push-image.sh localhost:5000 arch "$AMD64_ID" "$ARM64_ID"
      # A third digest pushed over the amd64 tag, after `push-arch` and before `push-index`. `index`
      # must build the index from the digests it is given, which are the ones attested. An `index`
      # that read `<version>-amd64` back from the registry instead would list this digest, and the
      # check below fails on that. Under the version tag the old script read the two architecture
      # tags and passed, so that case proved nothing.
      - id: moved
        name: Move the amd64 tag to a third digest
        run: |
          docker buildx build --platform linux/amd64 --tag "sluice-$IMAGE:moved" --load \
            --file docker/push-test/Dockerfile \
            --label "org.opencontainers.image.version=moved" docker/push-test
          docker tag "sluice-$IMAGE:moved" \
            "localhost:5000/sanamhub/sluice-$IMAGE:0.0.0-test-amd64"
          docker push "localhost:5000/sanamhub/sluice-$IMAGE:0.0.0-test-amd64"
          moved="$(docker buildx imagetools inspect \
            "localhost:5000/sanamhub/sluice-$IMAGE:0.0.0-test-amd64" \
            --format '{{json .Manifest}}' | jq --raw-output .digest)"
          echo "moved=$moved" >> "$GITHUB_OUTPUT"
      - id: push-index
        env:
          AMD64_DIGEST: ${{ steps.push-arch.outputs.amd64 }}
          ARM64_DIGEST: ${{ steps.push-arch.outputs.arm64 }}
        run: bash .github/release/push-image.sh localhost:5000 index "$AMD64_DIGEST" "$ARM64_DIGEST"
      # The script wrote a digest for each architecture and the index. Each must answer in the
      # registry as the manifest the script checked, the version tag must be the index, and the
      # index must list the two digests it was given and not the moved amd64 tag's.
      - name: Check what was pushed
        env:
          NAME: ${{ steps.push-index.outputs.name }}
          INDEX: ${{ steps.push-index.outputs.index }}
          AMD64: ${{ steps.push-arch.outputs.amd64 }}
          ARM64: ${{ steps.push-arch.outputs.arm64 }}
          MOVED: ${{ steps.moved.outputs.moved }}
        run: |
          for digest in "$INDEX" "$AMD64" "$ARM64"; do
            docker buildx imagetools inspect "$NAME@$digest" > /dev/null
          done
          # `--format '{{.Manifest.Digest}}'` prints the whole report, so the manifest is read as
          # JSON, as push-image.sh reads it.
          tagged="$(docker buildx imagetools inspect "$NAME:0.0.0-test" \
            --format '{{json .Manifest}}' | jq --raw-output .digest)"
          [ "$tagged" = "$INDEX" ]
          [ "$INDEX" != "$MOVED" ]
          listed="$(docker buildx imagetools inspect "$NAME:0.0.0-test" --raw \
            | jq --raw-output '.manifests[].digest' | sort)"
          want="$(printf '%s\n%s\n' "$AMD64" "$ARM64" | sort)"
          if grep -qxF "$MOVED" <<< "$listed"; then
            echo "::error::the index lists the moved amd64 tag, not the digest push-arch pushed"
            exit 1
          fi
          [ "$listed" = "$want" ]
      # A registry that starts with a dash would make the repository name below mean something
      # else, so it is refused before a token is sent.
      - name: A registry with a leading dash is refused
        env:
          GITHUB_OUTPUT: ${{ runner.temp }}/refusal-output
          AMD64_ID: ${{ steps.standins.outputs.amd64 }}
          ARM64_ID: ${{ steps.standins.outputs.arm64 }}
        run: |
          : > "$GITHUB_OUTPUT"
          set +e
          message="$(bash .github/release/push-image.sh -x arch "$AMD64_ID" "$ARM64_ID" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$message"
          test "$code" = 2
          grep -q "is not a registry" <<< "$message"
      # A tag is a release, and a release goes to ghcr.io only. The run must stop at the registry
      # check, before a token is sent anywhere, so the log may not hold a login. A step's `env`
      # cannot replace a GITHUB_ variable the runner sets, so the tag and the output file are set on
      # the command itself.
      - name: A tag refuses another registry
        env:
          AMD64_ID: ${{ steps.standins.outputs.amd64 }}
          ARM64_ID: ${{ steps.standins.outputs.arm64 }}
        run: |
          output="$RUNNER_TEMP/refusal-output"
          : > "$output"
          set +e
          message="$(GITHUB_REF=refs/tags/v0.0.0-test GITHUB_OUTPUT="$output" \
            bash .github/release/push-image.sh localhost:5000 arch "$AMD64_ID" "$ARM64_ID" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$message"
          test "$code" = 1
          grep -q 'pushes to ghcr.io only' <<< "$message"
          if grep -q 'Login Succeeded' <<< "$message"; then
            echo "::error::push-image.sh logged in before it refused the registry"
            exit 1
          fi
      - if: always()
        run: docker logout localhost:5000
