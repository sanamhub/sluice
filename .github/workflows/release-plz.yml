name: release-plz

# On every push to main, opens or updates one pull request that bumps the workspace version from the
# Conventional Commits since the last tag and adds the new section to CHANGELOG.md. It publishes
# nothing, tags nothing and makes no GitHub release: the maintainer tags the merge by hand, and that
# tag starts release.yml (docs/runbooks/releasing.md).
on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  RELEASE_PLZ_VERSION: 0.3.174

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only this job writes: the branch of the pull request, and the pull request itself.
    permissions:
      contents: write
      pull-requests: write
    # Two pushes close together must not race on the same branch.
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the commits since the last tag can be read.
          fetch-depth: 0
          # release-plz pushes through the GitHub API with the token below, not with git.
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      # At the version above, checked against a hash written in the script.
      - run: bash .github/release/install-release-plz.sh
      # The identity GITHUB_TOKEN acts as. release-plz/action asks the API for it, and it is the
      # same for every repository.
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # The token goes in through GIT_TOKEN, which release-plz reads, so it is not on a command
      # line that any process on the runner can list.
      - env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release-plz release-pr --forge github \
            --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --output json
