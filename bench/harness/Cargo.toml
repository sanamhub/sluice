[package]
name = "sluice-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bench"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
# The workspace tokio has no process or I/O support, which the harness needs to run commands on
# hosts and read their output.
tokio = { workspace = true, features = ["io-util", "process", "sync"] }
toml.workspace = true

[lints]
workspace = true

# Not released: dist builds only the `sluice` binary of sluice-cli (dist-workspace.toml).
[package.metadata.dist]
dist = false
