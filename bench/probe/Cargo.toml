[package]
name = "sluice-probe"
version.workspace = true
edition.workspace = true
# iroh 1.4.0 and iroh-blobs 0.103.1 both declare rust-version 1.91. The msrv job excludes this
# crate.
rust-version = "1.91"
license.workspace = true
publish = false

[[bin]]
name = "probe"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
blake3.workspace = true
clap.workspace = true
# portmapper is what makes `--port-mapping on` do anything: iroh swaps in a stub without it, and the
# option would read as on while nothing ran. unstable-net-report is the only way to read the address
# a rendezvous server reported. Both stay here so no product crate inherits them from the workspace.
iroh = { workspace = true, features = ["portmapper", "unstable-net-report"] }
iroh-blobs.workspace = true
iroh-relay.workspace = true
n0-future.workspace = true
noq.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

# The rendezvous test runs a real iroh-relay server in the test process. test-utils is where the
# self-signed helpers live, and `server` pulls in the whole server, which no probe binary carries.
[dev-dependencies]
iroh-relay = { workspace = true, features = ["server", "test-utils"] }
rcgen.workspace = true

[lints]
workspace = true

# Not released: dist builds only the `sluice` binary of sluice-cli (dist-workspace.toml).
[package.metadata.dist]
dist = false
