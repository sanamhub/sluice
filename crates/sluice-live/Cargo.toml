[package]
name = "sluice-live"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# No sluice-core: it brings getrandom and filesystem code, and the browser build of this crate must
# need neither.
[dependencies]
blake3.workspace = true
ed25519-dalek.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
# Reads the live vector files, to check every case's sender key and not one match per file.
serde_json.workspace = true

[lints]
workspace = true

# Not released: dist builds only the `sluice` binary of sluice-cli (dist-workspace.toml).
[package.metadata.dist]
dist = false
