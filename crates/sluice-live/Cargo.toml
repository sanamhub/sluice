[package]
name = "sluice-live"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The signed segmented log behind Sluice's live transfer of growing files"
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["p2p", "file-transfer", "streaming", "blake3", "iroh"]
categories = ["network-programming", "cryptography"]

# No sluice-core: it brings getrandom and filesystem code, and the browser build of this crate must
# need neither.
[dependencies]
blake3.workspace = true
ed25519-dalek.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
# Reads the live vector files, to check every case's sender key and not one match per file.
serde_json.workspace = true

[lints]
workspace = true

# Not released: dist builds only the `sluice` binary of sluice-cli (dist-workspace.toml).
[package.metadata.dist]
dist = false
