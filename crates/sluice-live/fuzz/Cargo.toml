[package]
name = "sluice-live-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
blake3 = "1.8.7"
ed25519-dalek = { version = "3", default-features = false }
libfuzzer-sys = "0.4.13"
sluice-live = { path = ".." }

[[bin]]
name = "log"
path = "fuzz_targets/log.rs"
test = false
doc = false
bench = false

# Its own workspace, so `cargo build --workspace` at the repository root never builds it. It needs a
# nightly compiler and the sanitizer flags that `cargo fuzz` sets, which no other crate here wants.
[workspace]
