[package]
name = "sluice-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The sluice command-line tool for peer-to-peer file transfer"
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["p2p", "file-transfer", "cli", "quic", "iroh"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "sluice_cli"
path = "src/lib.rs"

[[bin]]
name = "sluice"
path = "src/main.rs"

[dependencies]
anstream.workspace = true
# Hashes the file that `receipt verify --file` is given, from the crate every root comes from.
blake3.workspace = true
clap.workspace = true
clap_complete.workspace = true
futures-util = "0.3"
iroh = { workspace = true, features = ["unstable-net-report"] }
# The short-code meeting place: the same crate the relay uses, and a WebSocket client.
sluice-meet = { path = "../sluice-meet" }
tokio-websockets = { version = "=0.13.3", features = ["client", "server"] }
tokio-rustls = "0.26"
rustls.workspace = true
url.workspace = true
webpki-roots = "1"
portmapper = "0.19.3"
# The QR code `send --qr` prints. It draws nothing itself: the half blocks are written here.
qrcodegen.workspace = true
# The width of the terminal the code is drawn on, from the console API on Windows and `TIOCGWINSZ`
# elsewhere, so `COLUMNS` is only the fallback it is.
terminal_size = "0.4.4"
# Only for the JSON error object, whose message needs escaping.
serde_json.workspace = true
# The page the daemon serves: HTTP/1 on loopback, the bodies of its answers, and its key.
bytes.workspace = true
getrandom.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tokio-stream.workspace = true
# The daemon and the two commands that call it.
sluice-api = { path = "../sluice-api" }
sluice-core = { path = "../sluice-core" }
tokio.workspace = true
# The official MCP SDK, for `sluice mcp`: the server over standard input and output, with the tool
# macros and the schemas of the tools.
rmcp.workspace = true
serde.workspace = true
# The status the daemon answers a call with, which `daemon status` and `daemon stop` report.
tonic.workspace = true
# The daemon's own log lines, written to standard error.
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The SDK's client, which the tests of `sluice mcp` drive it with over a child process's standard
# input and output.
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
assert_cmd.workspace = true
# Signs the receipts that the tests of the verify command read, from the crate the identity uses.
ed25519-dalek.workspace = true
# A test that keeps `inspect` waiting registers the static content protocol's ALPN on its own
# endpoint, so it names that protocol rather than repeating its bytes.
iroh-blobs.workspace = true
insta.workspace = true
# Reads a rendered code back in the tests of `send --qr`. Without its default features it drops the
# image crate: the test hands it the module grid the renderer wrote, not a file.
rqrr = { version = "0.11", default-features = false }
tempfile.workspace = true

[lints]
workspace = true
