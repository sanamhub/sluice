[package]
name = "sluice-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The sluice command-line tool for peer-to-peer file transfer"
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["p2p", "file-transfer", "cli", "quic", "iroh"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "sluice_cli"
path = "src/lib.rs"

[[bin]]
name = "sluice"
path = "src/main.rs"

[dependencies]
anstream.workspace = true
clap.workspace = true
clap_complete.workspace = true
# Only for the JSON error object, whose message needs escaping.
serde_json.workspace = true
sluice-core = { path = "../sluice-core" }
tokio.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
insta.workspace = true
tempfile.workspace = true

[lints]
workspace = true
