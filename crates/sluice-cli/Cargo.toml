[package]
name = "sluice-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The sluice command-line tool for peer-to-peer file transfer"
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["p2p", "file-transfer", "cli", "quic", "iroh"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "sluice_cli"
path = "src/lib.rs"

[[bin]]
name = "sluice"
path = "src/main.rs"

[dependencies]
anstream.workspace = true
# Hashes the file that `receipt verify --file` is given, from the crate every root comes from.
blake3.workspace = true
clap.workspace = true
clap_complete.workspace = true
iroh = { workspace = true, features = ["unstable-net-report"] }
portmapper = "0.19.3"
# The QR code `send --qr` prints. It draws nothing itself: the half blocks are written here.
qrcodegen.workspace = true
# Only for the JSON error object, whose message needs escaping.
serde_json.workspace = true
sluice-core = { path = "../sluice-core" }
tokio.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
# Signs the receipts that the tests of the verify command read, from the crate the identity uses.
ed25519-dalek.workspace = true
# A test that keeps `inspect` waiting registers the static content protocol's ALPN on its own
# endpoint, so it names that protocol rather than repeating its bytes.
iroh-blobs.workspace = true
insta.workspace = true
# Reads a rendered code back in the tests of `send --qr`. Without its default features it drops the
# image crate: the test hands it the module grid the renderer wrote, not a file.
rqrr = { version = "0.11", default-features = false }
tempfile.workspace = true

[lints]
workspace = true
