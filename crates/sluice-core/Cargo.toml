[package]
name = "sluice-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
blake3.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true
unicase.workspace = true
unicode-normalization.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
# Reads the path vectors, to check the `rule` field that the conformance runner leaves alone.
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# A crate cannot inherit the workspace table and override one entry, so this repeats it with
# unsafe_code at deny. This crate may need unsafe later, and forbid cannot be relaxed by `allow`.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
