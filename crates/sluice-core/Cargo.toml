[package]
name = "sluice-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tickets, manifests, packing, ranges and the home layout for Sluice"
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["p2p", "file-transfer", "blake3", "quic", "iroh"]
categories = ["network-programming", "filesystem", "cryptography"]

[dependencies]
blake3.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
iroh.workspace = true
iroh-blobs.workspace = true
iroh-mdns-address-lookup.workspace = true
n0-future.workspace = true
noq.workspace = true
postcard.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sluice-live = { path = "../sluice-live" }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
unicase.workspace = true
unicode-normalization.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
# Reads the path vectors, to check the `rule` field that the conformance runner leaves alone.
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# A crate cannot inherit the workspace table and override one entry, so this repeats it with
# unsafe_code at deny. This crate may need unsafe later, and forbid cannot be relaxed by `allow`.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Not released: dist builds only the `sluice` binary of sluice-cli (dist-workspace.toml).
[package.metadata.dist]
dist = false
