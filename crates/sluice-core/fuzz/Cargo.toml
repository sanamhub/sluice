[package]
name = "sluice-core-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
sluice-core = { path = ".." }

[[bin]]
name = "manifest_path"
path = "fuzz_targets/manifest_path.rs"
test = false
doc = false
bench = false

# Its own workspace, so `cargo build --workspace` at the repository root never builds it. It needs a
# nightly compiler and the sanitizer flags that `cargo fuzz` sets, which no other crate here wants.
[workspace]
