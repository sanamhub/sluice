[package]
name = "sluice-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The browser half of Sluice: an endpoint in a tab, through a relay"
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["p2p", "file-transfer", "wasm", "browser", "iroh"]
categories = ["network-programming", "wasm"]

[lib]
# cdylib is what wasm-bindgen reads. rlib is what lets this crate be checked on the host, where the
# browser transport is not compiled in and the helpers are still type-checked.
crate-type = ["cdylib", "rlib"]

# Its own dependency spec and not `workspace = true`: the native binary asks `iroh` for
# `tls-aws-lc-rs`, and that provider has no build for the target. `ring` does, and it has no ML-KEM
# group, so a tab negotiates classical `X25519`; a native peer that applies the post-quantum rule
# refuses it, which is why the browser side stays a proof.
[dependencies]
iroh = { version = "1.4", default-features = false, features = ["tls-ring"] }
iroh-blobs = { version = "0.105.0", default-features = false }
# The timeout a fetch waits for its relay, which is the same one the native build uses and works on
# the target as well as on the host.
n0-future.workspace = true
# The JS side of the module. Pinned exactly, like the hashing crate, to the version `cargo xtask
# wasm-hash` installs.
wasm-bindgen = { workspace = true }
# Spike only (T88): a probe that pulls the SPAKE2 crate and its curve arithmetic into the wasm
# module so the added size can be measured. Never enabled by the product.
spake2 = { version = "=0.5.0-pre.0", features = ["getrandom"], optional = true }
# The version the lock resolves beside that `wasm-bindgen`, which is what an async export needs.
wasm-bindgen-futures = "=0.4.79"

# Runs the loopback test on the host, where the browser transport is not compiled in. The crate
# itself has no async runtime of its own: a page's promise is the whole of its concurrency. It is
# not a dependency of the wasm32 build at all, which is why the test that uses it is a host test.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }


[features]
short-code-probe = ["dep:spake2"]

[lints]
workspace = true

# Not released: dist builds only the `sluice` binary of sluice-cli (dist-workspace.toml).
[package.metadata.dist]
dist = false
