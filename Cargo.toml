[workspace]
resolver = "3"
members = [
  "crates/sluice-core",
  "crates/sluice-live",
  "crates/sluice-cli",
  "bench/probe",
  "bench/harness",
  "bench/wasm-hash",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
blake3 = "1"
# Only xtask uses it, to report the brotli size of the .wasm files.
brotli = "9"
clap = { version = "4", features = ["derive"] }
# tls-aws-lc-rs and not the default tls-ring: ADR 0012. metrics turns on the socket counters,
# which are no-ops without it.
iroh = { version = "1.3", default-features = false, features = ["metrics", "tls-aws-lc-rs"] }
# iroh does not re-export RelayQuicConfig, which names the UDP port of address discovery. Same release
# as iroh, so the probe and the server in the rendezvous image come from one version. The probe tests
# add its server feature.
iroh-relay = { version = "1.3", default-features = false }
# 0.94.0 to 0.103.0 accept unauthenticated push and are yanked.
iroh-blobs = "0.103.1"
# iroh re-exports neither the congestion controllers nor the rustls handshake data.
noq = { version = "1.3", default-features = false, features = ["rustls"] }
# Only for StreamExt on iroh-blobs' GetProgress stream. The version Cargo.lock already resolves through iroh.
n0-future = "0.3.2"
# Earlier releases leak session secrets through Debug. prefer-post-quantum ranks X25519MLKEM768
# first. Without it the group is offered but X25519 wins, and the handshake silently downgrades.
rustls = { version = "0.23.46", default-features = false, features = ["std", "aws-lc-rs", "prefer-post-quantum"] }
# Safe getrusage for the CPU time fields. Unix only; rustix has no getrusage.
nix = { version = "0.31", default-features = false, features = ["resource"] }
# Self-signed certificate for the rendezvous test. Already resolved through iroh-relay's server feature.
rcgen = "0.14"
# The ticket envelope. SPEC.md section 4 states its bytes, which are postcard 1.x's. Only `alloc`, for
# `to_allocvec`: the defaults add nothing this crate uses.
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
# Property tests for parsers. Without default features it skips fork and timeout, which add rusty-fork
# and tempfile to run each case in a child process. No test here needs that.
proptest = { version = "1.12", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
# Reads the bench harness's scenarios and hosts files.
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The NFC check on manifest paths (SPEC.md section 8, rule 2). Its only dependency is tinyvec.
unicode-normalization = "0.1.26"
# Pinned exactly: the version has to equal the wasm-bindgen CLI that the wasm-hash workflow installs
# and `cargo xtask wasm-hash` runs, and a lockfile update must not move it on its own.
wasm-bindgen = "=0.2.129"
# Only xtask uses it, to check which features each wasm-hash build needs. Without its `simd` feature it
# cannot read SIMD instructions, and the defaults add a component-model parser and serde that xtask never uses.
wasmparser = { version = "=0.262.0", default-features = false, features = ["std", "validate", "features", "simd"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
