[advisories]
version = 2
yanked = "deny"
# Unmaintained notices, not vulnerabilities, all reached through iroh and iroh-blobs. Each stays
# listed by id so a new advisory still fails the build.
ignore = [
  { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill via postcard 1.1 and heapless 0.7 (iroh-blobs, iroh-relay)" },
  { id = "RUSTSEC-2024-0436", reason = "paste via netlink-packet-core and netdev (iroh)" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via genawaiter and bao-tree (iroh-blobs)" },
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]

# Crate-scoped on purpose: a global entry would let any new dependency under these licenses through.
# The three Unlicense crates are the WebSocket stack iroh-relay uses on wasm32.
[[licenses.exceptions]]
crate = "async_io_stream"
allow = ["Unlicense"]

[[licenses.exceptions]]
crate = "pharos"
allow = ["Unlicense"]

[[licenses.exceptions]]
crate = "ws_stream_wasm"
allow = ["Unlicense"]

# Mozilla's root certificate list, which iroh-relay and rustls-platform-verifier ship as data.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# MPL-2.0 is copyleft per file, so it binds attohttpc's own files and not what links to it. It is the
# HTTP client igd-next uses for UPnP, which comes with the iroh `portmapper` feature that
# `probe --port-mapping on` needs, and which the product will need for port mapping on by default.
# Approved by @sanamhub on 2026-10-20, for this crate only.
[[licenses.exceptions]]
crate = "attohttpc"
allow = ["MPL-2.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
