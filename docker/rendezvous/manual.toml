# Address discovery only. The relay half is off, so no HTTP or HTTPS server runs and no transfer
# bytes pass through. Run with --dev: without it iroh-relay 1.3.0 refuses this config with
# "TLS not configured" (README.md).
enable_relay = false
enable_quic_addr_discovery = true

# The metrics server defaults to on and listens on [::]:9090 with no authentication.
enable_metrics = false

[tls]
# UDP. Address discovery is QUIC, so TLS is required even though no relay runs.
quic_bind_addr = "0.0.0.0:7842"
cert_mode = "Manual"
# Mount a directory holding default.crt and default.key here. The certificate has to name the
# host the clients dial, and it is read once at start, so restart the container after a renewal.
cert_dir = "/etc/rendezvous/certs"
