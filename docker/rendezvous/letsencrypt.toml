# LetsEncrypt needs the HTTPS server to answer its TLS-ALPN-01 challenge, and iroh-relay 1.3.0 starts
# that server only with the relay half on (README.md). So this config turns the half on and lets
# no endpoint in: the allowlist is empty, and every relay connection is denied.
#
# Run it without --dev:
#   --config-path /etc/rendezvous/letsencrypt.toml
enable_relay = true
enable_quic_addr_discovery = true
access.allowlist = []

# Port 8080 and 8443 are the container's side. Publish 8443 as 443, because LetsEncrypt validates
# on 443.
http_bind_addr = "0.0.0.0:8080"

# The metrics server defaults to on and listens on [::]:9090 with no authentication.
enable_metrics = false

[tls]
https_bind_addr = "0.0.0.0:8443"
quic_bind_addr = "0.0.0.0:7842"
cert_mode = "LetsEncrypt"
hostname = "rendezvous.example.net"
contact = "ops@example.net"
# The account key and the certificate. Mount a volume owned by uid 65532.
cert_dir = "/var/lib/rendezvous"
