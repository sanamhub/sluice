[package]
name = "sluice-relay-guard-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
sluice-relay-guard = { path = ".." }
# The loose mirror of iroh-relay's config in relay_differential, at the guard's versions.
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse"] }
# The parser iroh-relay reads `access.http.url` with, and the guard's, for the URL assertion.
url = "2.5.8"

[[bin]]
name = "relay_config"
path = "fuzz_targets/relay_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "relay_differential"
path = "fuzz_targets/relay_differential.rs"
test = false
doc = false
bench = false

# Its own workspace, as the guard's is. It needs a nightly compiler and the sanitizer flags that
# `cargo fuzz` sets, which the guard's own build does not want.
[workspace]
