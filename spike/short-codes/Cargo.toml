[package]
name = "short-codes-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "Spike: a short code meeting place beside iroh-relay (T88, throwaway)"

# A spike, not a workspace member: it is never built by CI and never released. The lock file is
# its own, so the spike cannot move the workspace's resolved versions.
[workspace]

[dependencies]
anyhow = "1"
base64 = "0.22"
brotli = "9"
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
iroh-base = "=1.4.1"
iroh-dns = "=1.4.1"
iroh-relay = { version = "=1.4.1", default-features = false, features = ["server", "tls-ring"] }
rcgen = "0.14"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha1 = "0.10"
rustls-pemfile = "2"
spake2 = { version = "=0.4.0", features = ["getrandom"] }
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tokio-websockets = { version = "=0.13.3", features = [
  "client",
  "server",
  "rustls-bring-your-own-connector",
] }
url = "2"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
